name: Apply journal language fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-log-language-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix second-person journal messages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'js/game.js';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = [
            ["      this.addLog(`${player.name} dobiera ${amount} kart za karę.`);", "      this.addLog(player.isHuman ? `Dobierasz ${amount} kart za karę.` : `${player.name} dobiera ${amount} kart za karę.`);"],
            ["    this.addLog(`${player.name} dobiera kartę.`);", "    this.addLog(player.isHuman ? 'Dobierasz kartę.' : `${player.name} dobiera kartę.`);"],
            ["    this.addLog(`${player.name} przyjmuje blokadę: ${count} ${count === 1 ? 'kolejka' : 'kolejki'}.`);", "    this.addLog(player.isHuman ? `Przyjmujesz blokadę: ${count} ${count === 1 ? 'kolejka' : 'kolejki'}.` : `${player.name} przyjmuje blokadę: ${count} ${count === 1 ? 'kolejka' : 'kolejki'}.`);"],
            ["    this.addLog(`${player.name} zagrywa ${ordered.map(cardLabel).join(', ')}.`);", "    this.addLog(player.isHuman ? `Zagrywasz ${ordered.map(cardLabel).join(', ')}.` : `${player.name} zagrywa ${ordered.map(cardLabel).join(', ')}.`);"],
            ["      this.addLog(`STOP MAKAO! ${player.name} dobiera 5 kart.`);", "      this.addLog(player.isHuman ? 'STOP MAKAO! Dobierasz 5 kart.' : `STOP MAKAO! ${player.name} dobiera 5 kart.`);"],
            ["    this.addLog(`${player.name} zajmuje ${player.finishPlace}. miejsce.`);", "    this.addLog(player.isHuman ? `Zajmujesz ${player.finishPlace}. miejsce.` : `${player.name} zajmuje ${player.finishPlace}. miejsce.`);"],
            ["      this.addLog(`${last.name} zajmuje ${last.finishPlace}. miejsce.`);", "      this.addLog(last.isHuman ? `Zajmujesz ${last.finishPlace}. miejsce.` : `${last.name} zajmuje ${last.finishPlace}. miejsce.`);"],
            ["        this.addLog(`${player.name} traci kolejkę i dobiera ${amount} kart za karę.`);", "        this.addLog(player.isHuman ? `Tracisz kolejkę i dobierasz ${amount} kart za karę.` : `${player.name} traci kolejkę i dobiera ${amount} kart za karę.`);"],
            ["        this.addLog(`${player.name} traci kolejkę.`);", "        this.addLog(player.isHuman ? 'Tracisz kolejkę.' : `${player.name} traci kolejkę.`);"],
          ];

          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`journal line not found: ${from}`);
            source = source.replace(from, to);
          }

          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Verify
        run: |
          npm test
          npm run check

      - name: Commit fix
        run: |
          if git diff --quiet -- js/game.js; then
            echo "already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.js
          git commit -m "style: use natural second-person journal text"
          git push
