name: Apply Jack rule fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-jack-rule-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Jack rule in game engine
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'js/game.js';
          let source = fs.readFileSync(path, 'utf8');

          source = source.replace(
            "import { BOT_NAMES, UI_DELAYS } from './constants.js';",
            "import { BOT_NAMES, JACK_DEMAND_RANKS, UI_DELAYS } from './constants.js';"
          );

          const botPattern = /        const demand = chooseJackDemand\(player\.hand\);\n        this\.state\.jackDemand = \{ rank: demand, byIndex: playerIndex \};\n        this\.addLog\(`\$\{player\.name\} żąda wartości \$\{demand\}\.``?\);/;
          const botReplacement = [
            '        const demand = chooseJackDemand(player.hand);',
            '        if (demand) {',
            '          this.state.jackDemand = { rank: demand, byIndex: playerIndex };',
            '          this.addLog(`${player.name} żąda wartości ${demand}.`);',
            '        } else {',
            '          this.state.jackDemand = null;',
            '          this.addLog(`${player.name} nie żąda żadnej wartości.`);',
            '        }',
          ].join('\n');
          if (!botPattern.test(source)) throw new Error('Bot Jack block not found');
          source = source.replace(botPattern, botReplacement);

          const humanPattern = /    if \(choice\.type === 'jack'\) \{\n      this\.state\.jackDemand = \{ rank: value, byIndex: actorIndex \};\n      this\.addLog\(`\$\{actor\.name\} żąda wartości \$\{value\}\.``?\);\n    \}/;
          const humanReplacement = [
            "    if (choice.type === 'jack') {",
            '      if (value == null) {',
            '        this.state.jackDemand = null;',
            '        this.addLog(`${actor.name} nie żąda żadnej wartości.`);',
            '      } else {',
            '        const mayDemand = JACK_DEMAND_RANKS.includes(value) && actor.hand.some((card) => card.rank === value);',
            '        if (!mayDemand) {',
            "          this.onMessage('Walet może żądać tylko wartości 5–10, którą masz w ręce, albo niczego.');",
            '          return;',
            '        }',
            '        this.state.jackDemand = { rank: value, byIndex: actorIndex };',
            '        this.addLog(`${actor.name} żąda wartości ${value}.`);',
            '      }',
            '    }',
          ].join('\n');
          if (!humanPattern.test(source)) throw new Error('Human Jack block not found');
          source = source.replace(humanPattern, humanReplacement);

          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Commit Jack rule fix
        run: |
          if git diff --quiet -- js/game.js; then
            echo "game.js already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.js
          git commit -m "fix: enforce Jack demand from held cards"
          git push
