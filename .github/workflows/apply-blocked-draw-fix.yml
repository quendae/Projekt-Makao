name: Apply blocked draw fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-blocked-draw-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch blocked-turn draw handling and regression test
        run: |
          node <<'NODE'
          const fs = require('fs');

          const gamePath = 'js/game.js';
          let game = fs.readFileSync(gamePath, 'utf8');
          const oldBlock = `    if (player.blockedTurns > 0 && !this.isPendingSkipFor(this.state.currentIndex)) {
              player.blockedTurns -= 1;
              this.addLog(\`${'${player.name}'} traci kolejkę.\`);
              this.emit();
              this.timer = setTimeout(() => this.endTurn(this.state.currentIndex), UI_DELAYS.blockedTurn);
              return;
            }`;
          const newBlock = `    if (player.blockedTurns > 0 && !this.isPendingSkipFor(this.state.currentIndex)) {
              player.blockedTurns -= 1;

              // A zaległa blokada nie może sprawić, że kara 2/3 zniknie bez rozliczenia.
              // Zablokowany gracz nie może się bronić kartą, ale nadal jest celem kary.
              if (this.isPendingDrawFor(this.state.currentIndex)) {
                const amount = this.state.pendingDraw.amount;
                this.state.pendingDraw = null;
                this.drawCards(this.state.currentIndex, amount);
                this.addLog(\`${'${player.name}'} traci kolejkę i dobiera ${'${amount}'} kart za karę.\`);
              } else {
                this.addLog(\`${'${player.name}'} traci kolejkę.\`);
              }

              this.emit();
              this.timer = setTimeout(() => this.endTurn(this.state.currentIndex), UI_DELAYS.blockedTurn);
              return;
            }`;

          if (!game.includes(oldBlock)) throw new Error('queueCurrentTurn blocked-turn block not found');
          game = game.replace(oldBlock, newBlock);
          fs.writeFileSync(gamePath, game, 'utf8');

          const testPath = 'tests/rules.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const marker = "test('nowa gra ma 1 gracza + 2/3 boty, po 5 kart i zwykłą kartę startową', () => {";
          const regression = `test('zaległa blokada nie omija aktywnej kary dobierania 2/3', () => {
            const game = new MakaoGame();
            game.state.started = true;
            game.state.players = game.createPlayers(2);
            game.state.currentIndex = 2; // Oskar
            game.state.players[2].hand = [card('7', 'clubs')];
            game.state.players[2].blockedTurns = 1;
            game.state.pendingDraw = { amount: 2, targetIndex: 2 };
            game.state.drawPile = [card('8', 'hearts'), card('9', 'diamonds')];

            game.queueCurrentTurn();
            clearTimeout(game.timer);

            assert.equal(game.state.players[2].blockedTurns, 0);
            assert.equal(game.state.pendingDraw, null);
            assert.equal(game.state.players[2].hand.length, 3);
            assert.match(game.state.log[0].message, /traci kolejkę i dobiera 2 kart za karę/);
          });

          `;
          if (!tests.includes(marker)) throw new Error('test insertion marker not found');
          if (!tests.includes("zaległa blokada nie omija aktywnej kary dobierania 2/3")) {
            tests = tests.replace(marker, regression + marker);
          }
          fs.writeFileSync(testPath, tests, 'utf8');
          NODE

      - name: Verify
        run: |
          npm test
          npm run check

      - name: Commit fix
        run: |
          if git diff --quiet -- js/game.js tests/rules.test.js; then
            echo "already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.js tests/rules.test.js
          git commit -m "fix: resolve draw penalties during blocked turns"
          git push
